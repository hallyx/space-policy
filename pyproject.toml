[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_policy_spacepolicy_act"
version = "0.1.0"
description = "Dynamics-aware imitation learning for free-floating on-orbit capture"
keywords = ["space-robotics", "imitation-learning", "on-orbit-capture", "act"]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "lerobot==0.5.1",
  "transformers==5.3.0",
  "numpy>=2.0,<2.3",
  "torch>=2.7,<2.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Paper = "https://rasevents.org/uploads/documents/pdfviewer/c1/0a/235289-1549.pdf"
Repository = "https://github.com/hallyx/space-policy"
Issues = "https://github.com/hallyx/space-policy/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lerobot_policy_spacepolicy_act*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
